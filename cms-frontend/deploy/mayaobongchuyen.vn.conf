server {
    server_name mayaobongchuyen.vn;
    client_max_body_size 32M;
    access_log /var/log/nginx/mayaobongchuyen.vn_access.log;
    error_log /var/log/nginx/mayaobongchuyen.vn_error.log;
    include /etc/nginx/snippets/cms-frontend-static-fallback.conf;
    location / {
        proxy_pass http://cms_frontend_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mayaobongchuyen.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mayaobongchuyen.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = mayaobongchuyen.vn) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name mayaobongchuyen.vn;
    return 404;
}
