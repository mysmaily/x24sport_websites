server {
    server_name mayaocaulong.vn;
    client_max_body_size 32M;
    access_log /var/log/nginx/mayaocaulong.vn_access.log;
    error_log /var/log/nginx/mayaocaulong.vn_error.log;
    location /cms/ {
        proxy_pass http://10.10.0.53:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
    location = /cms {
        return 301 /cms/;
    }
    include /etc/nginx/snippets/cms-frontend-static-fallback.conf;
    location / {
        proxy_pass http://cms_frontend_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mayaocaulong.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mayaocaulong.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = mayaocaulong.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name mayaocaulong.vn;
    return 404; # managed by Certbot
}
