server {
    listen 443 ssl;
    server_name www.dongphucx24.vn;

    ssl_certificate /etc/letsencrypt/live/dongphucx24.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dongphucx24.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dongphucx24.vn$request_uri;
}

server {
    listen 443 ssl;
    server_name dongphucx24.vn;
    client_max_body_size 32M;
    access_log /var/log/nginx/dongphucx24.vn_access.log;
    error_log /var/log/nginx/dongphucx24.vn_error.log;

    ssl_certificate /etc/letsencrypt/live/dongphucx24.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dongphucx24.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/cms-frontend-static-fallback.conf;

    location / {
        proxy_pass http://cms_frontend_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    server_name dongphucx24.vn www.dongphucx24.vn;
    return 301 https://dongphucx24.vn$request_uri;
}
