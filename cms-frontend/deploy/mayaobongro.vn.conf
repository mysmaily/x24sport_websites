server {
    listen 443 ssl;
    server_name mayaobongro.vn;
    client_max_body_size 32M;
    access_log /var/log/nginx/mayaobongro.vn_access.log;
    error_log /var/log/nginx/mayaobongro.vn_error.log;
    location /wp-content/uploads/ {
        alias /var/www/wp.mayaobongro.vn/wp-content/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* ^/wp-content/uploads/.*\.php(?:$|/) { return 404; }
    location ~* ^/(?:wp-admin|wp-json)(?:/|$) { return 404; }
    location = /wp-login.php { return 404; }
    location = /xmlrpc.php { return 404; }
    location = /wp-cron.php { return 404; }
    include /etc/nginx/snippets/cms-frontend-static-fallback.conf;
    location / {
        proxy_pass http://cms_frontend_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
    }
    ssl_certificate /etc/letsencrypt/live/mayaobongro.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mayaobongro.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    server_name mayaobongro.vn;
    return 301 https://$host$request_uri;
}
