server {
    listen 80;
    server_name mayaochaybo.vn;
    client_max_body_size 32M;
    access_log /var/log/nginx/mayaochaybo.vn_access.log;
    error_log /var/log/nginx/mayaochaybo.vn_error.log;
    location = /wp-admin { return 308 https://wp.mayaochaybo.vn/wp-admin/; }
    location ^~ /wp-admin/ { return 308 https://wp.mayaochaybo.vn$request_uri; }
    location = /wp-login.php { return 308 https://wp.mayaochaybo.vn/wp-login.php$is_args$args; }
    include /etc/nginx/snippets/cms-frontend-static-fallback.conf;
    location / {
        proxy_pass http://cms_frontend_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
